# ⚡ xlfr4n // Kali BSPWM 2026
# Personal desktop identity: status floats over the wallpaper.

[colors]
bg = #101216
panel = #151920
panel-2 = #1b2028
fg = #f0f3f7
muted = #7d8590
accent = #ff3344
good = #5ee881
warn = #ffc857
blue = #70a9ff
glass = #E50B0E12
glass-2 = #D9161B22
border = #262a31

[bar/main]
width = 94%
height = 28pt
offset-x = 3%
offset-y = 8pt
background = #00000000
foreground = ${colors.fg}
radius = 0
line-size = 0pt
line-color = #00000000
border-size = 0pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
override-redirect = true
fixed-center = true
cursor-click = pointer
font-0 = JetBrains Mono:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=11;3
wm-restack = bspwm
enable-ipc = true
screenchange-reload = true
modules-left = identity launcher target labstatus
modules-center = xwindow
modules-right = vpn network cpu memory filesystem pulseaudio battery virt uptime
separator =  │  
separator-foreground = ${colors.muted}
tray-position = none
tray-maxsize = 18
tray-padding = 1
tray-background = #00000000

[module/identity]
type = custom/script
exec = ~/.local/bin/xlfr4n-pulse
interval = 30
format = <label>
label = %output%
label-foreground = ${colors.accent}
label-background = #00000000
label-padding = 1
click-left = kali-menu
click-middle = theme-switch
click-right = xlfr4n-terminal --title xLFr4n-Doctor -- doctor.sh

[module/launcher]
type = custom/text
content = "⌘ APPS"
content-foreground = ${colors.fg}
content-background = #00000000
content-padding = 1
click-left = rofi-xlfr4n -show drun -show-icons

[module/mission]
type = custom/text
content = "◉ WINDOWS"
content-foreground = ${colors.fg}
content-background = #00000000
content-padding = 1
click-left = mission-control

[module/dock]
type = custom/text
content = "⌄ DOCK"
content-foreground = ${colors.fg}
content-background = ${colors.panel-2}
content-padding = 1
click-left = dock --toggle

[module/brave]
type = custom/text
content = "◉ BRAVE"
content-foreground = ${colors.accent}
content-background = ${colors.panel}
content-padding = 1
click-left = brave-browser --new-window

[module/target]
type = custom/script
exec = ~/.local/bin/target-pulse
interval = 1
format = <label>
label = %output%
label-padding = 1
label-foreground = ${colors.fg}
label-background = #00000000
click-left = target-copy
click-middle = cleartarget
click-right = xlfr4n-terminal --title Kali-Target -- settarget

# telemetry-pulse is retained in the repository for compatibility/reference; it is intentionally not loaded.

[module/labstatus]
exec = ~/.local/bin/lab --status-short
interval = 2
format = <label>
label = %output%
label-foreground = ${colors.fg}
label-background = #00000000
label-padding = 1
click-left = xlfr4n-terminal --title xLFr4n-Engagement -- lab status
click-right = xlfr4n-terminal --title xLFr4n-Tools -- lab tools status

[module/vpn]
type = custom/script
exec = ~/.local/bin/vpn-status
interval = 2
format = <label>
label = %output%
label-padding = 1

[module/virt]
type = custom/script
exec = sh -c 'v=$(systemd-detect-virt 2>/dev/null || echo bare); case "$v" in vmware) echo "VMWARE";; oracle|virtualbox) echo "VBOX";; none) echo "HOST";; *) echo "$v";; esac'
interval = 30
format = <label>
format-foreground = ${colors.blue}
label = %output%
click-left = xlfr4n-terminal --title VMware-Tools -- vmware-tools status

[module/session]
type = custom/text
content = "BSPWM // X11"
content-foreground = ${colors.muted}
content-padding = 1

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
label-focused = " %name% "
label-focused-foreground = ${colors.accent}
label-focused-background = #00000000
label-focused-padding = 0
label-focused-margin = 1
label-focused-underline = ${colors.accent}
label-focused-underline-size = 2
label-focused-font = 10
label-occupied = " %name% "
label-occupied-foreground = ${colors.fg}
label-occupied-background = #00000000
label-occupied-padding = 0
label-occupied-margin = 1
label-empty = " %name% "
label-empty-foreground = ${colors.muted}
label-empty-background = #00000000
label-empty-padding = 0
label-empty-margin = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T2}%{T-} "
label = CPU %percentage:2%%
click-left = xlfr4n-terminal --title xLFr4n-Monitor -- btop

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{T2}%{T-} "
label = RAM %percentage_used:2%%
click-left = xlfr4n-terminal --title xLFr4n-Monitor -- btop

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted-prefix = "%{T2}%{T-} "
label-mounted = SSD %percentage_used%%
click-left = xlfr4n-terminal --title xLFr4n-Storage -- sh -c 'df -h /; read -r -p "Press Enter to close..."'

[module/network]
type = custom/script
exec = ~/.local/bin/network-status
interval = 3
format = <label>
label = %output%
label-foreground = ${colors.good}
click-left = nm-connection-editor


[module/battery]
type = custom/script
exec = ~/.local/bin/battery-status
interval = 20
format = <label>
label = %output%
label-foreground = ${colors.good}

[module/uptime]
type = custom/script
exec = sh -c 'uptime -p 2>/dev/null | sed -E "s/^up //; s/, / · /g"'
interval = 30
format = <label>
format-prefix = "%{T2}%{T-} "
label = UP %output%
label-foreground = ${colors.muted}
click-left = xlfr4n-terminal --title xLFr4n-Doctor -- doctor.sh
[module/pulseaudio]
type = internal/pulseaudio
interval = 2
format-volume-prefix = "%{T2}%{T-} "
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = "MUTE"
label-muted-foreground = ${colors.warn}
click-left = pavucontrol
click-right = audio-control mute

[module/xwindow]
type = internal/xwindow
label = %title:0:42:...%
label-foreground = ${colors.muted}

[module/date]
type = custom/script
exec = ~/.local/bin/xlfr4n-date
interval = 60
format = <label>
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.accent}
format-prefix-background = #00000000
label = %output%
label-foreground = ${colors.fg}
label-background = #00000000
label-padding = 1

[module/time]
type = internal/date
interval = 5
time = %H:%M
format = <label>
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.accent}
format-prefix-background = #00000000
label = %time%
label-foreground = ${colors.fg}
label-background = #00000000
label-padding = 1

[module/power]
type = custom/text
content = " PWR "
content-foreground = ${colors.bg}
content-background = ${colors.accent}
content-padding = 1
click-left = power-menu

[global/wm]
# BSPWM already reserves the dock lane; do not add a second hidden bottom strut.
margin-bottom = 0pt
margin-top = 16pt


[bar/workspace]
# Bottom metadata rail sits over the framed wallpaper safe zone.
width = 100%
height = 48pt
offset-x = 0%
offset-y = 0pt
bottom = true
background = #00000000
foreground = ${colors.fg}
radius = 0
line-size = 0pt
line-color = #00000000
border-size = 0pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
override-redirect = true
fixed-center = true
cursor-click = pointer
font-0 = JetBrains Mono:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;3
wm-restack = bspwm
enable-ipc = true
modules-left = bspwm
modules-right = date time
tray-position = none

[bar/dock]
width = 48%
height = 64pt
offset-x = 26%
offset-y = 0pt
bottom = true
background = #00000000
foreground = ${colors.fg}
radius = 0
line-size = 0pt
border-size = 0pt
padding-left = 2
padding-right = 2
module-margin-left = 2
module-margin-right = 2
override-redirect = true
fixed-center = true
font-0 = Font Awesome 6 Free:style=Solid:size=16;3
font-1 = JetBrains Mono:size=9;2
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
modules-center = dock-menu dock-brave dock-terminal dock-files dock-code dock-burp dock-nvim dock-lab dock-target dock-firefox dock-wireshark
tray-position = none

[module/dock-menu]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.accent}
click-left = dock-launch kali

[module/dock-brave]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch brave

[module/dock-terminal]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch terminal

[module/dock-files]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch files

[module/dock-code]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch code

[module/dock-burp]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch burp

[module/dock-nvim]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch editor

[module/dock-lab]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.accent}
click-left = dock-launch lab

[module/dock-target]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.accent}
click-left = dock-launch target

[module/dock-firefox]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch firefox

[module/dock-wireshark]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = ${colors.fg}
click-left = dock-launch wireshark

